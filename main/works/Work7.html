<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Work 7 - Design Project</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎨</text></svg>">
    <style>
        /* ========== CSS Variables ========== */
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --secondary: #ec4899;
            --text: #ffffff;
            --text-secondary: #a1a1aa;
            --glass-bg: rgba(0, 0, 0, 0.6);
            --glass-border: rgba(255, 255, 255, 0.1);
            --gradient-primary: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --gradient-hero: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        /* ========== Reset & Base ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: url('../images/work7/0.webp') center center / cover no-repeat fixed;
            color: var(--text);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* ========== Video Background (inside hero section) ========== */
        .video-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .video-bg video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.7;
        }

        .section-dark-bg {
            background: rgba(0, 0, 0, 0.6);
        }

        /* ========== Navigation ========== */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
        }

        .nav-logo {
            font-size: 1.5rem;
            font-weight: bold;
            text-decoration: none;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-logo span {
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .nav-links {
            display: flex;
            gap: 30px;
            list-style: none;
        }

        .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            transition: color 0.3s;
            font-size: 0.95rem;
        }

        .nav-links a:hover {
            color: var(--primary);
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 30px;
            color: white;
            text-decoration: none;
            font-size: 0.9rem;
            backdrop-filter: blur(10px);
            transition: all 0.3s;
        }

        .back-btn:hover {
            background: var(--primary);
            border-color: var(--primary);
            transform: translateX(-5px);
        }

        /* ========== Hero Section ========== */
        .hero {
            position: relative;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 120px 40px 80px;
            text-align: center;
            z-index: 1;
        }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 20px;
            background: rgba(99, 102, 241, 0.2);
            border: 1px solid rgba(99, 102, 241, 0.4);
            border-radius: 50px;
            font-size: 0.9rem;
            margin-bottom: 30px;
            animation: fadeInDown 0.8s ease;
        }

        .hero-title {
            font-size: clamp(2.5rem, 8vw, 5rem);
            font-weight: 800;
            line-height: 1.1;
            margin-bottom: 30px;
            animation: fadeInUp 0.8s ease 0.2s both;
        }

        .hero-title .highlight {
            background: var(--gradient-hero);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .hero-description {
            max-width: 700px;
            font-size: 1.2rem;
            color: var(--text-secondary);
            margin-bottom: 50px;
            animation: fadeInUp 0.8s ease 0.4s both;
        }

        .hero-meta {
            display: flex;
            gap: 40px;
            flex-wrap: wrap;
            justify-content: center;
            animation: fadeInUp 0.8s ease 0.6s both;
        }

        .meta-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .meta-label {
            font-size: 0.85rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .meta-value {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .tool-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        .tool-tag {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 14px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            transition: all 0.3s ease;
        }

        .tool-tag:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.4);
            transform: translateY(-2px);
        }

        .tag-icon {
            width: 24px;
            height: 24px;
            object-fit: contain;
        }

        .tag-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .tag-name {
            font-size: 1.2rem;
            font-weight: 600;
            color: #fff;
            line-height: 1.2;
        }

        .tag-desc {
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.6);
            line-height: 1.2;
        }

        /* ========== Main Content ========== */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 40px;
        }

        /* ========== Image Section ========== */
        .image-section {
            padding: 80px 0;
        }

        .section-title {
            font-size: 2rem;
            margin-bottom: 40px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .section-title::before {
            content: '';
            width: 4px;
            height: 30px;
            background: var(--gradient-hero);
            border-radius: 2px;
        }

        /* 主图上传区域 */
        .main-image-upload {
            position: relative;
            width: 100%;
            height: 600px;
            border-radius: 24px;
            overflow: hidden;
            background: var(--glass-bg);
            border: 3px dashed rgba(255, 255, 255, 0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .main-image-upload:hover {
            border-color: var(--primary);
            background: rgba(99, 102, 241, 0.1);
        }

        .main-image-upload.has-image {
            border: none;
        }

        .main-image-upload input[type="file"] {
            display: none;
        }

        .upload-preview {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: none;
            background: #111;
        }

        .main-image-upload.has-image .upload-preview {
            display: block;
        }

        .main-image-upload.has-image .upload-placeholder {
            display: none;
        }

        .upload-placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            color: var(--text-secondary);
        }

        .upload-placeholder .icon {
            font-size: 4rem;
        }

        .upload-placeholder .text {
            font-size: 1.1rem;
        }

        .upload-placeholder .hint {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.5);
        }

        /* ========== Gallery Section ========== */
        .gallery-section {
            padding: 80px 0;
        }

        .gallery-item-upload {
            position: relative;
            width: 540px;
            height: 540px;
            border-radius: 16px;
            overflow: hidden;
            background: var(--glass-bg);
            border: 2px dashed rgba(255, 255, 255, 0.2);
            cursor: pointer;
            transition: all 0.3s;
            flex-shrink: 0;
        }

        .gallery-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
        }

        .gallery-item-upload:hover {
            border-color: var(--secondary);
            transform: translateY(-5px);
        }

        .gallery-item-upload.has-image {
            border: none;
        }

        .gallery-item-upload input[type="file"] {
            display: none;
        }

        .gallery-preview {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        .gallery-item-upload.has-image .gallery-preview {
            display: block;
        }

        .gallery-item-upload.has-image .gallery-placeholder {
            display: none;
        }

        .gallery-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: var(--text-secondary);
        }

        .gallery-placeholder .icon {
            font-size: 2.5rem;
            opacity: 0.5;
        }

        .gallery-placeholder .text {
            font-size: 0.9rem;
        }

        .gallery-item-upload:hover .delete-image-btn {
            opacity: 1;
        }

        /* 添加图片按钮 */
        .add-gallery-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 15px 30px;
            background: transparent;
            border: 2px dashed rgba(99, 102, 241, 0.5);
            border-radius: 16px;
            color: var(--primary);
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 30px;
        }

        .add-gallery-btn:hover {
            background: rgba(99, 102, 241, 0.1);
            border-color: var(--primary);
        }

        /* 详情页展示 */
        .details-section {
            padding: 80px 0;
        }

        .details-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(580px, 1fr));
            gap: 20px;
        }

        .details-item-wrapper {
            position: relative;
            width: 100%;
        }

        .details-item-upload {
            position: relative;
            width: 100%;
            min-height: 300px;
            border-radius: 16px;
            overflow: hidden;
            background: var(--glass-bg);
            border: 2px dashed rgba(255, 255, 255, 0.2);
            cursor: pointer;
            transition: all 0.3s;
        }

        .details-item-upload:hover {
            border-color: var(--secondary);
        }

        .details-item-upload.has-image {
            border: none;
        }

        /* ========== View Details Button ========== */
        .view-details-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 14px 32px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            border: none;
            border-radius: 25px;
            color: white;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            opacity: 0;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            z-index: 3;
        }

        .details-item-upload.has-image:hover .view-details-btn {
            opacity: 1;
        }

        .view-details-btn:hover {
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.5);
            transform: scale(1.05);
        }

        .details-item-upload input[type="file"] {
            display: none;
        }

        .details-preview {
            width: 100%;
            height: auto;
            display: none;
            z-index: 1;
        }

        .details-item-upload.has-image .details-preview {
            display: block;
        }

        .details-item-upload.has-image .details-placeholder {
            display: none;
        }

        .details-placeholder {
            width: 100%;
            height: 267px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 15px;
            color: var(--text-secondary);
        }

        .details-placeholder .icon {
            font-size: 3rem;
            opacity: 0.5;
        }

        .details-placeholder .text {
            font-size: 1rem;
        }

        .details-placeholder .hint {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.4);
        }

        /* ========== Footer ========== */
        .details-item-wrapper:hover .delete-image-btn {
            opacity: 1;
        }

        .delete-image-btn:hover {
            background: #ff0000;
            transform: scale(1.1);
        }

        /* ========== Description Section ========== */
        .description-section {
            padding: 80px 0;
        }

        .description-box {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 50px;
        }

        .description-text {
            font-size: 1.1rem;
            line-height: 1.8;
            color: var(--text-secondary);
        }

        .description-text p {
            margin-bottom: 20px;
        }

        .description-text p:last-child {
            margin-bottom: 0;
        }

        /* 文字编辑 */
        .editable-title {
            background: transparent;
            border: none;
            border-bottom: 2px dashed transparent;
            color: inherit;
            font: inherit;
            padding: 5px 10px;
            margin: -5px -10px;
            border-radius: 8px;
            transition: all 0.3s;
        }

        .editable-title:hover,
        .editable-title:focus {
            border-bottom-color: var(--primary);
            background: rgba(99, 102, 241, 0.1);
            outline: none;
        }

        .editable-text {
            background: transparent;
            border: 2px dashed transparent;
            color: inherit;
            font: inherit;
            width: 100%;
            padding: 10px;
            margin: -10px 0;
            border-radius: 8px;
            transition: all 0.3s;
            resize: none;
            min-height: 100px;
        }

        .editable-text:hover,
        .editable-text:focus {
            border-color: var(--primary);
            background: rgba(99, 102, 241, 0.1);
            outline: none;
        }

        /* ========== Tags Section ========== */
        .tags-section {
            padding: 80px 0;
        }

        .tags-container {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
        }

        .tag {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            background: rgba(99, 102, 241, 0.15);
            border: 1px solid rgba(99, 102, 241, 0.3);
            border-radius: 50px;
            font-size: 0.9rem;
            transition: all 0.3s;
        }

        .tag:hover {
            background: var(--primary);
            border-color: var(--primary);
            transform: translateY(-2px);
        }

        .add-tag-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            background: transparent;
            border: 2px dashed rgba(255, 255, 255, 0.3);
            border-radius: 50px;
            color: var(--text-secondary);
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s;
        }

        .add-tag-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        /* ========== Footer ========== */
        .footer {
            padding: 60px 0;
            text-align: center;
            border-top: 1px solid var(--glass-border);
            margin-top: 80px;
        }

        .footer-text {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .footer-text a {
            color: var(--primary);
            text-decoration: none;
        }

        /* ========== Animations ========== */
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ========== Responsive ========== */
        @media (max-width: 768px) {
            .navbar {
                padding: 15px 20px;
            }

            .nav-links {
                display: none;
            }

            .hero {
                padding: 100px 20px 60px;
            }

            .container {
                padding: 0 20px;
            }

            .description-box {
                padding: 30px 20px;
            }

            .gallery-grid {
                grid-template-columns: 1fr;
            }

            .details-grid {
                grid-template-columns: 1fr;
            }
        }

        /* 回到顶部按钮 */
        .back-to-top {
            position: fixed;
            right: 30px;
            bottom: 30px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border: none;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            z-index: 1000;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
        }

        .back-to-top.visible {
            opacity: 1;
            visibility: visible;
        }

        .back-to-top:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.6);
        }

        .back-to-top svg {
            transform: rotate(0deg);
        }

        /* 返回按钮 */
        .back-to-portfolio {
            position: fixed;
            top: 20px;
            right: 30px;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            text-decoration: none;
            border-radius: 25px;
            font-size: 14px;
            font-weight: 500;
            z-index: 1000;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
            transition: all 0.3s ease;
        }

        .back-to-portfolio:hover {
            transform: translateX(-5px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.6);
        }

        .back-to-portfolio svg {
            transition: transform 0.3s ease;
        }

        .back-to-portfolio:hover svg {
            transform: translateX(-3px);
        }
    </style>

<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-logo">
            <span>🎨</span>
            <span>AIGC Portfolio</span>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="hero">
        <!-- Video Background -->

        <div class="hero-badge">
            <span>✨</span>
            <span>Design Project</span>
        </div>
        <h1 class="hero-title">
            <span class="highlight">Dog Water Bottle</span>
        </h1>
        <div class="hero-meta">
            <div class="meta-item">
                <span class="meta-label">使用工具</span>
                <div class="tool-tags">
                    <div class="tool-tag">
                        <img src="../images/work7/chatgpt.png" alt="ChatGPT" class="tag-icon">
                        <div class="tag-info">
                            <span class="tag-name">ChatGPT</span>
                            <span class="tag-desc">Generate image from text</span>
                        </div>
                    </div>
                    <div class="tool-tag">
                        <img src="../images/work7/photoshop.png" alt="Photoshop" class="tag-icon">
                        <div class="tag-info">
                            <span class="tag-name">Photoshop</span>
                            <span class="tag-desc">Image processing</span>
                        </div>
                    </div>
                    <div class="tool-tag">
                        <img src="../images/work7/illustrator.png" alt="Illustrator" class="tag-icon">
                        <div class="tag-info">
                            <span class="tag-name">Illustrator</span>
                            <span class="tag-desc">Image layout</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    <!-- Gallery Section -->
    <section class="gallery-section section-dark-bg">

    <!-- Secondary Gallery Section -->
    <section class="gallery-section section-dark-bg">

            <h2 class="section-title">Secondary image display</h2>
            <div class="gallery-grid" id="secondaryGalleryGrid">
            </div>
        </div>
    </section>

    <!-- Details Section -->
    <section class="details-section section-dark-bg">
        <div class="container">
            <h2 class="section-title">Detail page display</h2>
            <div class="details-grid" id="detailsGrid"></div>
        </div>
    </section>

    <script>
        let galleryCount = 5;

        // ========== 默认静态图片路径（部署后直接读取） ==========
        const defaultImages = {
            gallery: [
                '../images/work7/gallery1.webp'
            ],
            details: [
                '../images/work7/details1.webp'
            ]
        };

        // 副图展示默认图片
        const defaultSecondaryImages = {
            gallery: [
                '../images/work7/gallery2.webp',
                '../images/work7/gallery3.webp',
                '../images/work7/gallery4.webp',
                '../images/work7/gallery5.webp'
            ]
        };

        // ========== IndexedDB 管理 ==========
        const DB_NAME = 'ProductPageDB7';
        const DB_VERSION = 1;
        const STORE_NAME = 'images';
        let db = null;

        function initDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, DB_VERSION);
                
                request.onerror = () => reject(request.error);
                request.onsuccess = () => {
                    db = request.result;
                    resolve(db);
                };
                
                request.onupgradeneeded = (event) => {
                    const database = event.target.result;
                    if (!database.objectStoreNames.contains(STORE_NAME)) {
                        database.createObjectStore(STORE_NAME, { keyPath: 'id' });
                    }
                };
            });
        }

        function saveImageToDB(id, dataURL) {
            return new Promise((resolve, reject) => {
                if (!db) {
                    initDB().then(() => saveImageToDB(id, dataURL).then(resolve).catch(reject));
                    return;
                }
                
                const transaction = db.transaction([STORE_NAME], 'readwrite');
                const store = transaction.objectStore(STORE_NAME);
                const request = store.put({ id, data: dataURL, timestamp: Date.now() });
                
                request.onsuccess = () => resolve();
                request.onerror = () => reject(request.error);
            });
        }

        function loadImageFromDB(id) {
            return new Promise((resolve, reject) => {
                if (!db) {
                    initDB().then(() => loadImageFromDB(id).then(resolve).catch(reject));
                    return;
                }
                
                const transaction = db.transaction([STORE_NAME], 'readonly');
                const store = transaction.objectStore(STORE_NAME);
                const request = store.get(id);
                
                request.onsuccess = () => resolve(request.result ? request.result.data : null);
                request.onerror = () => reject(request.error);
            });
        }

        function deleteImageFromDB(id) {
            return new Promise((resolve, reject) => {
                if (!db) {
                    initDB().then(() => deleteImageFromDB(id).then(resolve).catch(reject));
                    return;
                }
                
                const transaction = db.transaction([STORE_NAME], 'readwrite');
                const store = transaction.objectStore(STORE_NAME);
                const request = store.delete(id);
                
                request.onsuccess = () => resolve();
                request.onerror = () => reject(request.error);
            });
        }

        async function saveToStorage() {
            try {
                const currentGalleryItems = document.querySelectorAll('#galleryGrid .gallery-item-upload');
                currentGalleryItems.forEach((item, index) => {
                    const preview = item.querySelector('.gallery-preview');
                    if (preview && preview.src && !preview.src.startsWith(window.location.href)) {
                        saveImageToDB(`gallery_${index}`, preview.src);
                    }
                });

                const currentSecondaryItems = document.querySelectorAll('#secondaryGalleryGrid .gallery-item-upload');
                currentSecondaryItems.forEach((item, index) => {
                    const preview = item.querySelector('.gallery-preview');
                    if (preview && preview.src && !preview.src.startsWith(window.location.href)) {
                        saveImageToDB(`secondary_gallery_${index}`, preview.src);
                    }
                });

                const currentDetailsItems = document.querySelectorAll('#detailsGrid .details-item-upload');
                currentDetailsItems.forEach((item, index) => {
                    const preview = item.querySelector('.details-preview');
                    if (preview && preview.src && !preview.src.startsWith(window.location.href)) {
                        saveImageToDB(`details_${index}`, preview.src);
                    }
                });
            } catch (e) {
                console.warn('保存图片失败', e);
            }
        }

        // ========== 检查图片是否存在的辅助函数 ==========
        function checkImageExists(src) {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = () => resolve(true);
                img.onerror = () => resolve(false);
                img.src = src;
            });
        }

        async function loadFromStorage() {
            try {
                await initDB();

                // 主图展示：先初始化空格子，再加载图片
                initGallery();

                // 只加载1张主图
                for (let i = 1; i <= 1; i++) {
                    const galleryKey = `gallery_${i - 1}`;
                    const galleryDefaultPath = defaultImages.gallery[i - 1];
                    let data = null;

                    if (await checkImageExists(galleryDefaultPath)) {
                        data = galleryDefaultPath;
                    } else {
                        data = await loadImageFromDB(galleryKey);
                    }

                    if (data) {
                        const preview = document.getElementById(`galleryPreview${i}`);
                        const uploadArea = document.getElementById(`galleryItem${i}`);
                        if (preview && uploadArea) {
                            preview.loading = 'lazy';
                            preview.src = data;
                            uploadArea.classList.add('has-image');
                        }
                    }
                }

                // 副图展示：加载副图图片
                initSecondaryGallery();
                for (let i = 1; i <= 4; i++) {
                    const secondaryKey = `secondary_gallery_${i - 1}`;
                    const secondaryDefaultPath = defaultSecondaryImages.gallery[i - 1];
                    let data = null;

                    if (await checkImageExists(secondaryDefaultPath)) {
                        data = secondaryDefaultPath;
                    } else {
                        data = await loadImageFromDB(secondaryKey);
                    }

                    if (data) {
                        const preview = document.getElementById(`secondaryGalleryPreview${i}`);
                        const uploadArea = document.getElementById(`secondaryGalleryItem${i}`);
                        if (preview && uploadArea) {
                            preview.loading = 'lazy';
                            preview.src = data;
                            uploadArea.classList.add('has-image');
                        }
                    }
                }

                // 详情页：加载已保存的图片
                for (let i = 0; i < defaultImages.details.length; i++) {
                    const detailsKey = `details_${i}`;
                    const defaultPath = defaultImages.details[i];
                    let data = null;

                    if (await checkImageExists(defaultPath)) {
                        data = defaultPath;
                    } else {
                        data = await loadImageFromDB(detailsKey);
                    }

                    const wrapper = document.createElement('div');
                    wrapper.className = 'details-item-wrapper';

                    if (data) {
                        wrapper.innerHTML = `
                            <div class="details-item-upload has-image" id="detailsItem${i + 1}">
                                <img class="details-preview" id="detailsPreview${i + 1}" src="${data}" loading="lazy">
                                <button class="view-details-btn" data-src="${data}">查看详情</button>
                            </div>
                        `;
                    } else {
                        wrapper.innerHTML = `
                            <div class="details-item-upload" id="detailsItem${i + 1}">
                                <img class="details-preview" id="detailsPreview${i + 1}">
                                <div class="details-placeholder">
                                    <span class="icon">📄</span>
                                    <span class="text">详情页 ${i + 1}</span>
                                </div>
                            </div>
                        `;
                    }
                    document.getElementById('detailsGrid').appendChild(wrapper);
                }
            } catch (e) {
                console.warn('加载图片失败', e);
            }
        }

        // 初始化主图展示
        function initGallery() {
            const galleryGrid = document.getElementById('galleryGrid');
            if (galleryGrid.children.length > 0) return;

            // 只创建1个主图展示
            for (let i = 1; i <= 1; i++) {
                const item = document.createElement('div');
                item.className = 'gallery-item-upload';
                item.id = `galleryItem${i}`;
                item.innerHTML = `
                    <img class="gallery-preview" id="galleryPreview${i}" loading="lazy">
                    <div class="gallery-placeholder">
                        <span class="icon">🖼️</span>
                        <span class="text">图片 ${i}</span>
                    </div>
                `;
                galleryGrid.appendChild(item);
            }
        }

        // 初始化副图展示
        function initSecondaryGallery() {
            const secondaryGrid = document.getElementById('secondaryGalleryGrid');
            if (secondaryGrid.children.length > 0) return;

            // 创建4个副图展示
            for (let i = 1; i <= 4; i++) {
                const item = document.createElement('div');
                item.className = 'gallery-item-upload';
                item.id = `secondaryGalleryItem${i}`;
                item.innerHTML = `
                    <img class="gallery-preview" id="secondaryGalleryPreview${i}" loading="lazy">
                    <div class="gallery-placeholder">
                        <span class="icon">🖼️</span>
                        <span class="text">副图 ${i}</span>
                    </div>
                `;
                secondaryGrid.appendChild(item);
            }
        }

        // 添加副图展示项
        function addSecondaryGalleryItem() {
            secondaryGalleryCount++;
            const secondaryGrid = document.getElementById('secondaryGalleryGrid');
            const item = document.createElement('div');
            item.className = 'gallery-item-upload';
            item.id = `secondaryGalleryItem${secondaryGalleryCount}`;
            item.innerHTML = `
                <img class="gallery-preview" id="secondaryGalleryPreview${secondaryGalleryCount}" loading="lazy">
                <div class="gallery-placeholder">
                    <span class="icon">🖼️</span>
                    <span class="text">副图 ${secondaryGalleryCount}</span>
                </div>
            `;
            secondaryGrid.appendChild(item);
        }

        // 初始化副图数量
        let secondaryGalleryCount = 4;

        // ========== Video Auto Play ==========
        document.addEventListener('click', function init() {
            const video = document.querySelector('.video-bg video');
            if (video) {
                video.play().catch(() => {});
            }
            document.removeEventListener('click', init);
        }, { once: true });

        // ========== 回到顶部 ==========
        function scrollToTop() {
            window.scrollTo({
                top: 0,
                behavior: 'smooth'
            });
        }

        // 初始化
        document.addEventListener('DOMContentLoaded', async () => {
            await loadFromStorage();
            initGallery();
            initSecondaryGallery();

            // 滚动监听：延迟到 idle 时期执行，不阻塞首屏
            const initScrollListener = () => {
                window.addEventListener('scroll', () => {
                    const btn = document.querySelector('.back-to-top');
                    if (btn) {
                        if (window.scrollY > 300) {
                            btn.classList.add('visible');
                        } else {
                            btn.classList.remove('visible');
                        }
                    }
                });
            };

            if ('requestIdleCallback' in window) {
                requestIdleCallback(initScrollListener, { timeout: 3000 });
            } else {
                setTimeout(initScrollListener, 500);
            }
        });
    </script>
