<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>视频轮播测试</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #000; 
            color: #fff;
            min-height: 100vh;
        }
        
        /* 视频容器 */
        .video-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }
        
        .video-bg video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 1s ease;
        }
        
        .video-bg video.active {
            opacity: 1;
        }
        
        /* 遮罩 */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 0;
        }
        
        /* 内容 */
        .content {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 40px 20px;
            text-align: center;
        }
        
        h1 {
            font-size: clamp(2rem, 8vw, 4rem);
            margin-bottom: 20px;
        }
        
        .status {
            background: rgba(255,255,255,0.1);
            padding: 20px 40px;
            border-radius: 12px;
            margin: 20px 0;
            font-size: 1.1rem;
        }
        
        .status.error { background: rgba(255,0,0,0.2); border: 1px solid #f00; }
        .status.success { background: rgba(0,255,0,0.2); border: 1px solid #0f0; }
        
        .btn {
            padding: 14px 32px;
            font-size: 1rem;
            background: #6366f1;
            color: white;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            margin: 10px;
            transition: 0.3s;
        }
        
        .btn:hover {
            background: #4f46e5;
            transform: scale(1.05);
        }
        
        .debug-info {
            margin-top: 40px;
            padding: 20px;
            background: rgba(0,0,0,0.5);
            border-radius: 12px;
            text-align: left;
            max-width: 600px;
            width: 100%;
            font-size: 0.9rem;
        }
        
        .debug-info h3 {
            margin-bottom: 10px;
            color: #6366f1;
        }
        
        .debug-info p {
            margin: 5px 0;
            color: #ccc;
        }
    </style>
</head>
<body>
    <!-- 视频背景 -->
    <div class="video-bg" id="videoBg">
        <video id="v1" class="active" muted autoplay loop playsinline>
            <source src="video/video1.mp4" type="video/mp4">
        </video>
        <video id="v2" muted autoplay loop playsinline>
            <source src="video/video2.mp4" type="video/mp4">
        </video>
    </div>
    
    <!-- 遮罩 -->
    <div class="overlay"></div>
    
    <!-- 内容 -->
    <div class="content">
        <h1>视频轮播测试</h1>
        
        <div class="status" id="status">点击页面任意位置尝试播放视频</div>
        
        <div>
            <button class="btn" onclick="playAll()">▶ 强制播放</button>
            <button class="btn" onclick="nextVideo()">⏭ 切换视频</button>
            <button class="btn" onclick="location.reload()">🔄 刷新</button>
        </div>
        
        <div class="debug-info">
            <h3>调试信息</h3>
            <p>视频1状态: <span id="s1">加载中...</span></p>
            <p>视频2状态: <span id="s2">加载中...</span></p>
            <p>浏览器: <span id="browser"></span></p>
            <p>是否静音: <span id="muted"></span></p>
        </div>
    </div>
    
    <script>
        const v1 = document.getElementById('v1');
        const v2 = document.getElementById('v2');
        const videos = [v1, v2];
        let current = 0;
        
        // 调试信息
        document.getElementById('browser').textContent = navigator.userAgent.includes('Chrome') ? 'Chrome' : 
                                                        navigator.userAgent.includes('Firefox') ? 'Firefox' : 'Other';
        
        function updateStatus(msg, type = '') {
            const el = document.getElementById('status');
            el.textContent = msg;
            el.className = 'status ' + type;
        }
        
        function updateDebug() {
            const s1 = document.getElementById('s1');
            const s2 = document.getElementById('s2');
            const muted = document.getElementById('muted');
            
            s1.textContent = getStatus(v1);
            s2.textContent = getStatus(v2);
            muted.textContent = v1.muted ? '是 (必须)' : '否';
        }
        
        function getStatus(v) {
            if (v.error) return '❌ 加载错误: ' + (v.error.code === 4 ? '找不到文件' : '未知错误');
            if (v.readyState === 0) return '⏳ 等待加载';
            if (v.readyState === 1) return '📥 加载中...';
            if (v.readyState >= 2) return v.paused ? '⏸️ 已暂停' : '▶️ 播放中';
            return '❓ 未知';
        }
        
        function playAll() {
            videos.forEach(v => {
                v.play().then(() => {
                    updateStatus('✅ 视频播放成功！', 'success');
                }).catch(e => {
                    updateStatus('❌ 播放失败: ' + e.message, 'error');
                });
            });
        }
        
        function nextVideo() {
            videos[current].classList.remove('active');
            current = (current + 1) % videos.length;
            videos[current].classList.add('active');
            videos[current].play().catch(() => {});
            updateStatus(`切换到视频 ${current + 1}`, '');
        }
        
        // 首次点击强制播放
        document.addEventListener('click', function init() {
            playAll();
            document.removeEventListener('click', init);
        }, { once: true });
        
        // 监听视频事件
        videos.forEach((v, i) => {
            v.addEventListener('error', () => updateStatus('❌ 视频' + (i+1) + ' 加载失败', 'error'));
            v.addEventListener('canplay', () => updateDebug());
            v.addEventListener('play', () => { updateStatus('▶️ 视频播放中', 'success'); updateDebug(); });
            v.addEventListener('pause', () => updateDebug());
        });
        
        // 定期更新调试信息
        setInterval(updateDebug, 1000);
        updateDebug();
        
        // 页面可见性变化
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) {
                videos.forEach(v => v.play().catch(() => {}));
            }
        });
    </script>
</body>
</html>
