<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UI-1</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>">
    <style>
        /* ========== CSS Variables ========== */
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --secondary: #ec4899;
            --text: #ffffff;
            --text-secondary: #a1a1aa;
            --glass-bg: rgba(0, 0, 0, 0.6);
            --glass-border: rgba(255, 255, 255, 0.1);
            --gradient-primary: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --gradient-hero: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        /* ========== Reset & Base ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: #000 url('../images/ui1/0.png') no-repeat center center;
            background-size: cover;
            color: var(--text);
            line-height: 1.6;
            overflow-x: hidden;
        }

        @media (min-width: 769px) {
            body {
                background-attachment: fixed;
            }
        }

        /* ========== Navigation ========== */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
        }

        .nav-logo {
            font-size: 1.5rem;
            font-weight: bold;
            text-decoration: none;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-logo span {
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 30px;
            color: white;
            text-decoration: none;
            font-size: 0.9rem;
            backdrop-filter: blur(10px);
            transition: all 0.3s;
        }

        .back-btn:hover {
            background: var(--primary);
            border-color: var(--primary);
            transform: translateX(-5px);
        }

        /* ========== Hero Section ========== */
        .hero {
            position: relative;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 120px 40px 80px;
            text-align: center;
            z-index: 1;
        }

        /* ========== 工具图标标签 ========== */
        .tools-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            margin-top: 30px;
            animation: fadeInUp 0.8s ease 0.4s both;
        }

        .tool-tag {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            background: rgba(135, 206, 250, 0.3); /* 浅蓝色背景 */
            border: 1px solid rgba(135, 206, 250, 0.5);
            border-radius: 50px;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            cursor: default;
        }

        .tool-tag:hover {
            background: rgba(99, 179, 237, 0.5);
            border-color: rgba(99, 179, 237, 0.8);
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(135, 206, 250, 0.4);
        }

        .tool-tag img {
            width: 24px;
            height: 24px;
            object-fit: contain;
        }

        .tool-tag span {
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text);
        }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 20px;
            background: rgba(99, 102, 241, 0.2);
            border: 1px solid rgba(99, 102, 241, 0.4);
            border-radius: 50px;
            font-size: 0.9rem;
            margin-bottom: 30px;
            animation: fadeInDown 0.8s ease;
        }

        .hero-title {
            font-size: clamp(2.5rem, 8vw, 5rem);
            font-weight: 800;
            line-height: 1.1;
            margin-bottom: 30px;
            animation: fadeInUp 0.8s ease 0.2s both;
        }

        .hero-title .highlight {
            background: var(--gradient-hero);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* ========== Main Content ========== */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 40px;
        }

        /* ========== Poster Section ========== */
        .poster-section {
            padding: 80px 0;
            background: rgba(0, 0, 0, 0.6);
        }

        .poster-grid {
            display: flex;
            flex-direction: row;
            gap: 100px;/*图片框的间距*/
            flex-wrap: wrap;
            justify-content: center;
        }

        .poster-upload-wrapper {
            position: relative;
        }

        .poster-image-upload {
            position: relative;
            width: 375px;
            height: 812px;
            border-radius: 24px;
            overflow: hidden;
            background: var(--glass-bg);
            border: 3px dashed rgba(255, 255, 255, 0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .poster-image-upload:hover {
            border-color: var(--primary);
            background: rgba(99, 102, 241, 0.1);
        }

        .poster-image-upload.has-image {
            border: none;
        }

        .poster-image-upload input {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        .poster-image-upload img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            cursor: pointer;
        }

        .poster-image-upload .upload-placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            color: var(--text-secondary);
        }

        .poster-image-upload .icon {
            font-size: 3rem;
        }

        .poster-image-upload .text {
            font-size: 1rem;
        }

        .poster-image-upload .hint {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .poster-image-upload.has-image .poster-preview {
            display: block;
        }

        .poster-image-upload.has-image .upload-placeholder {
            display: none;
        }

        .delete-poster-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 40px;
            height: 40px;
            background: rgba(255, 0, 0, 0.8);
            border: none;
            border-radius: 50%;
            color: white;
            font-size: 1.2rem;
            cursor: pointer;
            opacity: 0;
            transition: all 0.3s;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .poster-upload-wrapper:hover .delete-poster-btn {
            opacity: 1;
        }

        .delete-poster-btn:hover {
            background: #ff0000;
            transform: scale(1.1);
        }

        .section-title {
            font-size: 2rem;
            margin-bottom: 40px;
            margin-left: 130px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .section-title::before {
            content: '';
            width: 4px;
            height: 30px;
            background: var(--gradient-hero);
            border-radius: 2px;
        }

        /* ========== Fullscreen Preview ========== */
        .fullscreen-preview {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .fullscreen-preview.active {
            display: flex;
            opacity: 1;
        }

        .fullscreen-preview img {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .fullscreen-close-btn {
            position: absolute;
            top: 30px;
            right: 30px;
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            z-index: 1001;
        }

        .fullscreen-close-btn:hover {
            background: #ff4757;
            border-color: #ff4757;
            transform: scale(1.1);
        }

        .preview-counter {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.7);
            font-size: 1rem;
        }

        .preview-nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }

        .preview-nav-btn:hover {
            background: var(--primary);
            border-color: var(--primary);
        }

        .preview-prev-btn {
            left: calc(50% - 250px);
        }

        .preview-next-btn {
            right: calc(50% - 250px);
        }

        @media (max-width: 1100px) {
            .preview-prev-btn {
                left: 30px;
            }
            .preview-next-btn {
                right: 30px;
            }
        }

        /* ========== Footer ========== */
        .footer {
            padding: 60px 0;
            text-align: center;
            border-top: 1px solid var(--glass-border);
            margin-top: 80px;
        }

        .footer-text {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .footer-text a {
            color: var(--primary);
            text-decoration: none;
        }

        /* ========== Animations ========== */
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ========== Responsive ========== */
        @media (max-width: 768px) {
            .navbar {
                padding: 15px 20px;
            }

            .hero {
                padding: 100px 20px 60px;
            }

            .container {
                padding: 0 20px;
            }

            .poster-grid {
                flex-direction: column;
                align-items: center;
            }

            .poster-image-upload {
                width: 100%;
                max-width: 375px;
                aspect-ratio: 375/812;
                height: auto;
            }

            .poster-image-upload .poster-preview {
                position: absolute !important;
                top: 0 !important;
                left: 0 !important;
                width: 100% !important;
                height: 100% !important;
                object-fit: cover !important;
                display: block !important;
            }
        }

        /* 回到顶部按钮 */
        .back-to-top {
            position: fixed;
            right: 30px;
            bottom: 30px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border: none;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            z-index: 1000;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
        }

        .back-to-top.visible {
            opacity: 1;
            visibility: visible;
        }

        .back-to-top:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.6);
        }

        .back-to-top svg {
            transform: rotate(0deg);
        }

        /* 返回按钮 */
        .back-to-portfolio {
            position: fixed;
            top: 20px;
            right: 30px;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            text-decoration: none;
            border-radius: 25px;
            font-size: 14px;
            font-weight: 500;
            z-index: 1000;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
            transition: all 0.3s ease;
        }

        .back-to-portfolio:hover {
            transform: translateX(-5px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.6);
        }

        .back-to-portfolio svg {
            transition: transform 0.3s ease;
        }

        .back-to-portfolio:hover svg {
            transform: translateX(-3px);
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-logo">
            <span>🚀</span>
            <span>AIGC Portfolio</span>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="hero">
        <div class="hero-badge">

            <span>UI设计</span>
        </div>
        <h1 class="hero-title">
            <span class="highlight">教育学习</span>
        </h1>
        <div class="tools-tags">
            <div class="tool-tag">
                <img src="../images/ui1/chatgpt.png" alt="ChatGPT" loading="lazy">

            </div>
            <div class="tool-tag">
                <img src="../images/ui1/photoshop.png" alt="Photoshop" loading="lazy">
                <span>Photoshop</span>
            </div>
            <div class="tool-tag">
                <img src="../images/ui1/illustrator.png" alt="Illustrator" loading="lazy">
                <span>Illustrator</span>
            </div>
            <div class="tool-tag">
                <img src="../images/ui1/mj.png" alt="Midjourney" loading="lazy">
                <span>Midjourney</span>
            </div>
        </div>
    </section>

    <!-- Poster Section -->
    <section class="poster-section">
        <div class="container">
            <h2 class="section-title">UI</h2>
            <div class="poster-grid">
                <div class="poster-upload-wrapper">
                    <div class="poster-image-upload has-image" id="posterUpload1">
                        <img class="poster-preview" id="posterPreview1" src="../images/ui1/1.png" loading="lazy">
                    </div>
                </div>
                <div class="poster-upload-wrapper">
                    <div class="poster-image-upload has-image" id="posterUpload2">
                        <img class="poster-preview" id="posterPreview2" src="../images/ui1/2.png" loading="lazy">
                    </div>
                </div>
                <div class="poster-upload-wrapper">
                    <div class="poster-image-upload has-image" id="posterUpload3">
                        <img class="poster-preview" id="posterPreview3" src="../images/ui1/3.png" loading="lazy">
                    </div>
                </div>
                <div class="poster-upload-wrapper">
                    <div class="poster-image-upload has-image" id="posterUpload4">
                        <img class="poster-preview" id="posterPreview4" src="../images/ui1/4.png" loading="lazy">
                    </div>
                </div>
                <div class="poster-upload-wrapper">
                    <div class="poster-image-upload has-image" id="posterUpload5">
                        <img class="poster-preview" id="posterPreview5" src="../images/ui1/5.png" loading="lazy">
                    </div>
                </div>
                <div class="poster-upload-wrapper">
                    <div class="poster-image-upload has-image" id="posterUpload6">
                        <img class="poster-preview" id="posterPreview6" src="../images/ui1/6.png" loading="lazy">
                    </div>
                </div>
                <div class="poster-upload-wrapper">
                    <div class="poster-image-upload has-image" id="posterUpload7">
                        <img class="poster-preview" id="posterPreview7" src="../images/ui1/7.png" loading="lazy">
                    </div>
                </div>
                <div class="poster-upload-wrapper">
                    <div class="poster-image-upload has-image" id="posterUpload8">
                        <img class="poster-preview" id="posterPreview8" src="../images/ui1/8.png" loading="lazy">
                    </div>
                </div>
                <div class="poster-upload-wrapper">
                    <div class="poster-image-upload has-image" id="posterUpload9">
                        <img class="poster-preview" id="posterPreview9" src="../images/ui1/9.png" loading="lazy">
                    </div>
                </div>
                <div class="poster-upload-wrapper">
                    <div class="poster-image-upload has-image" id="posterUpload10">
                        <img class="poster-preview" id="posterPreview10" src="../images/ui1/10.png" loading="lazy">
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script>
        // ========== 默认静态图片路径（部署后直接读取） ==========
        const defaultImages = {
            poster1: '../images/ui1/1.png',
            poster2: '../images/ui1/2.png',
            poster3: '../images/ui1/3.png',
            poster4: '../images/ui1/4.png',
            poster5: '../images/ui1/5.png',
            poster6: '../images/ui1/6.png',
            poster7: '../images/ui1/7.png',
            poster8: '../images/ui1/8.png',
            poster9: '../images/ui1/9.png',
            poster10: '../images/ui1/10.png'
        };

        // ========== IndexedDB 管理 ==========
        const DB_NAME = 'ProductPageDB';
        const DB_VERSION = 1;
        const STORE_NAME = 'images';
        let db = null;

        function initDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, DB_VERSION);
                
                request.onerror = () => reject(request.error);
                request.onsuccess = () => {
                    db = request.result;
                    resolve(db);
                };
                
                request.onupgradeneeded = (event) => {
                    const database = event.target.result;
                    if (!database.objectStoreNames.contains(STORE_NAME)) {
                        database.createObjectStore(STORE_NAME, { keyPath: 'id' });
                    }
                };
            });
        }

        function loadImageFromDB(id) {
            return new Promise((resolve, reject) => {
                if (!db) {
                    initDB().then(() => loadImageFromDB(id).then(resolve).catch(reject));
                    return;
                }
                
                const transaction = db.transaction([STORE_NAME], 'readonly');
                const store = transaction.objectStore(STORE_NAME);
                const request = store.get(id);
                
                request.onsuccess = () => resolve(request.result ? request.result.data : null);
                request.onerror = () => reject(request.error);
            });
        }

        // ========== 直接加载图片（兼容移动端） ==========
        async function loadFromStorage() {
            try {
                await initDB();

                for (let i = 1; i <= 10; i++) {
                    const posterKey = `poster${i}`;
                    const defaultPath = defaultImages[posterKey];
                    const preview = document.getElementById(`posterPreview${i}`);
                    const uploadArea = document.getElementById(`posterUpload${i}`);

                    if (!preview || !uploadArea) continue;

                    // 先尝试直接设置静态图片路径
                    preview.src = defaultPath;
                }
            } catch (e) {
                console.warn('加载图片失败', e);
            }
        }

        // 图片加载失败时尝试从 IndexedDB 读取
        function setupImageFallback() {
            for (let i = 1; i <= 10; i++) {
                const preview = document.getElementById(`posterPreview${i}`);
                if (preview) {
                    preview.addEventListener('error', async function () {
                        try {
                            if (!db) await initDB();
                            const data = await loadImageFromDB(`poster${i}`);
                            if (data) {
                                this.src = data;
                            }
                        } catch (e) {
                            console.warn(`加载图片 poster${i} 失败`, e);
                        }
                    });
                }
            }
        }

        // 回到顶部
        function scrollToTop() {
            window.scrollTo({
                top: 0,
                behavior: 'smooth'
            });
        }

        // 初始化
        document.addEventListener('DOMContentLoaded', async () => {
            await loadFromStorage();
            setupImageFallback();

            // 滚动监听
            window.addEventListener('scroll', () => {
                const btn = document.querySelector('.back-to-top');
                if (btn) {
                    if (window.scrollY > 300) {
                        btn.classList.add('visible');
                    } else {
                        btn.classList.remove('visible');
                    }
                }
            });

            // ========== 全屏预览功能 ==========
            const previewModal = document.getElementById('previewModal');
            const previewImage = document.getElementById('previewImage');
            const previewCounter = document.getElementById('previewCounter');
            const closePreviewBtn = document.getElementById('closePreviewBtn');
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            
            let currentIndex = 0;
            const totalPosters = 10;
            
            // 点击图片打开全屏预览
            document.querySelectorAll('.poster-preview').forEach((img, index) => {
                img.addEventListener('click', () => {
                    currentIndex = index;
                    openPreview(index);
                });
            });
            
            function openPreview(index) {
                const preview = document.getElementById(`posterPreview${index + 1}`);
                if (preview && preview.src) {
                    previewImage.src = preview.src;
                    previewCounter.textContent = `${currentIndex + 1} / ${totalPosters}`;
                    previewModal.classList.add('active');
                    document.body.style.overflow = 'hidden';
                    // 隐藏返回按钮和回到顶部按钮
                    document.querySelector('.back-to-portfolio').style.display = 'none';
                    document.querySelector('.back-to-top').style.display = 'none';
                }
            }
            
            function closePreview() {
                previewModal.classList.remove('active');
                document.body.style.overflow = '';
                // 显示返回按钮和回到顶部按钮
                document.querySelector('.back-to-portfolio').style.display = 'flex';
                document.querySelector('.back-to-top').style.display = 'flex';
            }
            
            function showPrev() {
                currentIndex = (currentIndex - 1 + totalPosters) % totalPosters;
                openPreview(currentIndex);
            }
            
            function showNext() {
                currentIndex = (currentIndex + 1) % totalPosters;
                openPreview(currentIndex);
            }
            
            closePreviewBtn.addEventListener('click', closePreview);
            prevBtn.addEventListener('click', showPrev);
            nextBtn.addEventListener('click', showNext);
            
            // 点击背景关闭
            previewModal.addEventListener('click', (e) => {
                if (e.target === previewModal) {
                    closePreview();
                }
            });
            
            // 键盘控制
            document.addEventListener('keydown', (e) => {
                if (!previewModal.classList.contains('active')) return;
                if (e.key === 'Escape') closePreview();
                if (e.key === 'ArrowLeft') showPrev();
                if (e.key === 'ArrowRight') showNext();
            });
        });
    </script>

    <!-- 全屏预览 Modal -->
    <div class="fullscreen-preview" id="previewModal">
        <button class="fullscreen-close-btn" id="closePreviewBtn">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M18 6L6 18M6 6l12 12"/>
            </svg>
        </button>
        <button class="preview-nav-btn preview-prev-btn" id="prevBtn">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M15 18l-6-6 6-6"/>
            </svg>
        </button>
        <img id="previewImage" src="" alt="预览">
        <button class="preview-nav-btn preview-next-btn" id="nextBtn">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M9 18l6-6-6-6"/>
            </svg>
        </button>
        <div class="preview-counter" id="previewCounter">1 / 10</div>
    </div>

    <!-- 返回按钮 -->
    <a href="../home.html#works" class="back-to-portfolio" title="返回精选作品">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        <span>返回</span>
    </a>

    <!-- 回到顶部按钮 -->
    <button class="back-to-top" onclick="scrollToTop()" title="回到顶部">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 19V5M5 12l7-7 7 7"/>
        </svg>
    </button>

    <!-- Footer -->
    <footer class="footer">
        <p class="footer-text">© 2026 Creative Portfolio. All rights reserved.</p>
    </footer>
</body>
</html>
