<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Portfolio</title>
    <link rel="stylesheet" href="landing.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800;900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="landing">
        <!-- 背景动画画布层 -->
        <canvas id="bgCanvas" class="landing-bg-canvas" aria-hidden="true"></canvas>
        <canvas id="grainCanvas" class="landing-grain" aria-hidden="true"></canvas>
        <canvas id="noiseCanvas" class="landing-noise" aria-hidden="true"></canvas>
        <canvas id="pixelCursorCanvas" class="pixel-cursor-canvas" aria-hidden="true"></canvas>

        <!-- Main Content -->
        <main class="landing-main">
            <div class="book-wrapper">
                <img id="bookImage" src="images/book.webp" alt="Portfolio Book" class="book-image">
                <div class="book-shadow" aria-hidden="true"></div>
                <div class="book-bloom" aria-hidden="true"></div>
            </div>
        </main>

        <!-- Bottom CTA -->
        <footer class="landing-footer">
            <button class="enter-btn" type="button">Click Picture To Start</button>
        </footer>

        <!-- Oversized Outlined Text -->
        <div class="outlined-text" aria-hidden="true">
            <span class="outlined-text__item outlined-text__item--top-left">AIGC</span>
            <span class="outlined-text__item outlined-text__item--top-right">Portfolio</span>
            <!--
            <span class="outlined-text__item outlined-text__item--bottom-left">Creative</span>
            -->
            <span class="outlined-text__item outlined-text__item--bottom-center">2026</span>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="landing.js"></script>
</body>
</html>
